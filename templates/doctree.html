<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ドキュメント管理</title>
  <!-- EasyMDEのCSSとJS -->
     <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css"
      />
      <script src="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.js"></script>
  
  <style>
    body {
      margin: 0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      color: #333;
    }
    header {
      background-color: #343a40;
      color: white;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header a { color: #ffc107; text-decoration: none; margin-left: 15px;}

    /* 2カラム管理コンテナ */
    .manager-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* 左側：サイドバー（一覧） */
    .sidebar {
      width: 320px;
      background-color: #f8f9fa;
      border-right: 1px solid #dee2e6;
      display: flex;
      flex-direction: column;
    }
    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid #dee2e6;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-create {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .doc-list {
      list-style: none;
      padding: 0;
      margin: 0;
      overflow-y: auto;
      flex: 1;
    }
    .doc-item {
      padding: 15px 20px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      transition: background 0.2s;
    }
    .doc-item:hover { background-color: #e9ecef; }
    .doc-item.active { background-color: #007bff; color: white; }
    .doc-item h3 { margin: 0 0 5px 0; font-size: 1.05rem; }
    .doc-date { font-size: 0.8rem; color: #6c757d; }
    .doc-item.active .doc-date { color: #ddf; }

    /* 右側：メインエリア */
    .main-content {
      flex: 1;
      padding: 40px;
      overflow-y: auto;
      background-color: #fff;
    }
    .placeholder {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      color: #6c757d;
      font-size: 1.2rem;
    }

    /* フォーム・エディタヘッダー */
    .editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #eee;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }
    .title-input {
      font-size: 2rem;
      font-weight: bold;
      width: 70%;
      border: none;
      outline: none;
      background: transparent;
    }
    .title-input:not([readonly]) {
      border-bottom: 1px solid #ccc;
    }
    .btn-group button {
      padding: 8px 16px;
      margin-left: 5px;
      border-radius: 4px;
      border: 1px solid #ccc;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-edit { background-color: #007bff; color: white; border: none; }
    .btn-save { background-color: #28a745; color: white; border: none; }
    .btn-delete { background-color: #dc3545; color: white; border: none; }

    /* EasyMDE リードオンリー（プレビュー）用のCSSハック */
    .readonly-editor.editor-toolbar { display: none; } /* ツールバー非表示 */
    .readonly-editor.CodeMirror { display: none; }     /* 入力エリア非表示 */
    .readonly-editor.editor-preview-active-side { display: block; width: 100%; position: static; } /* プレビューを全面に */
  </style>

  <style>
/* ツリー全体 */
.tree-view {
  padding: 10px;
  user-select: none; /* 文字のドラッグ選択を防ぐ */
}

/* フォルダ・ファイルの共通ノードスタイル */
.tree-node, .tree-item {
  padding: 6px 10px;
  cursor: pointer;
  font-size: 0.9rem;
  border-radius: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: background 0.2s;
}

/* マウスホバー時のエフェクト */
.tree-node:hover, .tree-item:hover {
  background-color: #f1f3f4;
}

/* HTML標準の折りたたみ三角矢印を消す（カスタムアイコンで見やすくするため） */
details summary {
  list-style: none; /* 矢印を非表示に */
}
details summary::-webkit-details-marker {
  display: none; /* Safari用 */
}

/* 親ノードが閉じているとき・開いているときでアイコンや文字を強調したい場合のベース */
.font-bold {
  font-weight: bold;
  color: #1a73e8; /* ルート階層は少し青っぽく */
}

/* 子階層のインデント（右にずらすことでツリー構造を表現） */
.tree-children {
  padding-left: 18px; /* 階層が深くなるごとに18pxずつ右にズレる */
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin-top: 2px;
}

/* 選択されたアクティブなドキュメントファイルの見た目 */
.tree-item.active {
  background-color: #e8f0fe;
  color: #1a73e8;
  font-weight: bold;
}

  </style>
  
</head>
<body>

  <!-- 共通ヘッダー部分 -->
  <header>
    <div>
      <span style="font-size: 1.3rem; font-weight: bold;">社内グループウェア</span>
    </div>
    <div>
      ようこそ、{{ current_user.username }} さん | 
      <a href="/">ダッシュボード</a> | 
      <a href="/logout">ログアウト</a>
    </div>
  </header>


  <!-- メインレイアウト -->
  <div class="manager-container">
    
    <!-- 左：サイドバー（一覧） -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h2 style="margin:0; font-size: 1.2rem;">ドキュメント一覧</h2>
        <button class="btn-create" onclick="clickNewDocument()">+ 新規追加</button>
      </div>


<!-- ツリーView全体のコンテナ -->
<div class="tree-view">

  <!-- ルート階層（例：社内共有ドキュメント） -->
  <details open> <!-- 初期状態で開いておきたい場合は「open」属性をつける -->
    <summary class="tree-node font-bold">📁 社内ドキュメント</summary>
    <div class="tree-children">
      
      <!-- 子階層（開発部フォルダ） -->
      <details>
        <summary class="tree-node">📁 開発部</summary>
        <div class="tree-children">
          <div class="tree-item active" onclick="alert('仕様書を選択')">📄 要件定義仕様書.md</div>
          <div class="tree-item" onclick="alert('設計書を選択')">📄 データベース設計書.md</div>
        </div>
      </details>

      <!-- 子階層（総務部フォルダ） -->
      <details>
        <summary class="tree-node">📁 総務部</summary>
        <div class="tree-children">
          <div class="tree-item" onclick="alert('規約を選択')">📄 社内セキュリティ規約.md</div>
          <div class="tree-item" onclick="alert('申請書を選択')">📄 リモートワーク申請書.md</div>
        </div>
      </details>

      <!-- フォルダに属さない第一階層のドキュメント -->
      <div class="tree-item" onclick="alert('全体通知を選択')">📄 全体アナウンス.md</div>

    </div>
  </details>

  <!-- 別ルート（例：個人用フォルダ） -->
  <details>
    <summary class="tree-node font-bold">📁 個人用スペース</summary>
    <div class="tree-children">
      <div class="tree-item">📄 アイデアメモ.md</div>
      <div class="tree-item">📄 日報_20261012.md</div>
    </div>
  </details>

</div>

    </div>

    <!-- 右：メインコンテンツ（プレビュー兼編集エリア） -->
    <div class="main-content">
      <!-- ドキュメント未選択時の案内表示 -->
      <div id="view-placeholder" class="placeholder">
        ドキュメントを選択するか、新しく作成してください。
      </div>

      <!-- 操作・表示フォーム（初期状態は非表示） -->
      <div id="view-editor-area" style="display: none;">
        <form id="markdown-form" method="POST" action="/markdown/save">
          <!-- 更新時に必要なドキュメントID用の隠しフィールド -->
          <input type="hidden" id="form-doc-id" name="doc_id">

          <div class="editor-header">
            <!-- タイトル用インプット（閲覧時は readonly） -->
            <input type="text" id="form-title" name="title" class="title-input" readonly required>
            
            <!-- ボタンの制御グループ -->
            <div class="btn-group">
              <button type="button" id="btn-edit" class="btn-edit" onclick="switchToEditMode()">編集</button>
              <button type="submit" id="btn-save" class="btn-save" style="display: none;">保存する</button>
              <button type="button" id="btn-cancel" onclick="switchToReadOnlyMode()">キャンセル</button>
              <button type="button" id="btn-delete" class="btn-delete" onclick="submitDeleteForm()">削除</button>
            </div>
          </div>

          <!-- EasyMDEを適用するコンテナ。JSでクラスを切り替えてリードオンリー化します -->
          <div id="mde-wrapper" class="readonly-editor">
            <textarea id="easymde-textarea" name="content"></textarea>
          </div>
        </form>

        <!-- 削除リクエスト送信用の隠しフォーム -->
        <form id="delete-form" method="POST" action="" style="display: none;"></form>
      </div>
    </div>

  </div>

  <script>
    let mde = null;
    let selectedDoc = null; // 現在選択中のドキュメント情報を一時保存

    // ページ読み込み時にイベントリスナーを登録
    document.addEventListener("DOMContentLoaded", () => {
      const items = document.querySelectorAll(".doc-item");
      items.forEach(item => {
        item.addEventListener("click", () => {
          // クリックされた要素からデータ属性を取得
          const docId = item.getAttribute("data-id");
          const docTitle = item.getAttribute("data-title");
          const docContent = item.getAttribute("data-content");
          
          // アクティブクラスの制御
          items.forEach(i => i.classList.remove("active"));
          item.classList.add("active");

          // ドキュメントをリードオンリーでロード
          loadDocument(docId, docTitle, docContent);
        });
      });
    });

    // EasyMDEのインスタンスをモードに応じて再構築するヘルパー
    function buildEditor(isReadOnly) {
      if (mde) {
        mde.toTextArea(); // 既存のエディタを破棄
        mde = null;
      }

      const wrapper = document.getElementById("mde-wrapper");
      
      if (isReadOnly) {
        // リードオンリー（プレビュー）モードの設定
	 /*
        mde = new EasyMDE({
          element: document.getElementById("easymde-textarea"),
          toolbar: false,   // ツールバーを隠す
          readOnly: true,   // 編集不可にする
          status: false,
          spellChecker: false
        });
        //mde.togglePreview(); // 自動でプレビュー画面に切り替え
        //ewrapper.className = "readonly-editor";
	*/
        mde = new EasyMDE({
          element: document.getElementById("easymde-textarea"),
          toolbar: false,   // ツールバーを隠す
          //toolbar: ["bold", "italic", "heading", "|", "quote", "unordered-list", "ordered-list", "|", "link", "image", "|", "preview", "side-by-side", "fullscreen"],
          status: false,
          spellChecker: false
        });
        //mde.togglePreview(); // 自動でプレビュー画面に切り替え
        //wrapper.className = ""; // スタイルリセット
        //wrapper.className = "readonly-editor";
        mde.codemirror.setOption('readOnly', true);

      } else {
        // 通常編集モードの設定
        mde = new EasyMDE({
          element: document.getElementById("easymde-textarea"),
          toolbar: ["bold", "italic", "heading", "|", "quote", "unordered-list", "ordered-list", "|", "link", "image", "|", "preview", "side-by-side", "fullscreen"],
          status: false,
          spellChecker: false
        });
        wrapper.className = ""; // スタイルリセット
        mde.codemirror.setOption('readOnly', false);
      }
    }

    // ドキュメントを選択したときの表示処理（リードオンリー表示）
    function loadDocument(id, title, content) {
      // キャッシュに保存（キャンセル用）
      selectedDoc = { id, title, content };

      // エリアの表示切り替え
      document.getElementById("view-placeholder").style.display = "none";
      document.getElementById("view-editor-area").style.display = "block";

      // フォームデータのセット
      document.getElementById("form-doc-id").value = id;
      
      const titleInput = document.getElementById("form-title");
      titleInput.value = title;
      titleInput.readOnly = true;

      // ボタンの初期状態化
      document.getElementById("btn-edit").style.display = "inline-block";
      document.getElementById("btn-delete").style.display = "inline-block";
      document.getElementById("btn-save").style.display = "none";
      document.getElementById("btn-cancel").style.display = "none";

      // エディタに値をセットしてリードオンリービルド
      //console.log(content)
      //document.getElementById("easymde-textarea").value = content;
      buildEditor(true);
     if (mde) {
        //mde.value(content);
        console.log(content)
        //mde.value("AAAA");
        mde.value(content);
      }
    }

    // 閲覧状態から「編集モード」へ切り替える関数
    function switchToEditMode() {
      const titleInput = document.getElementById("form-title");
      titleInput.readOnly = false;
      titleInput.focus();

      // ボタンの反転
      document.getElementById("btn-edit").style.display = "none";
      document.getElementById("btn-delete").style.display = "none";
      document.getElementById("btn-save").style.display = "inline-block";
      document.getElementById("btn-cancel").style.display = "inline-block";

      // EasyMDE内のテキストデータを退避させ、通常モードで再構築
      const currentMarkdown = mde.value();
      buildEditor(false);
      mde.value(currentMarkdown);
    }

    // 編集キャンセル時、または初期の閲覧モードに戻す関数
    function switchToReadOnlyMode() {
      if (selectedDoc) {
        // 編集前の状態に戻して再ロード
        loadDocument(selectedDoc.id, selectedDoc.title, selectedDoc.content);
      } else {
        // 新規作成時のキャンセルは初期の未選択状態に戻す
        document.getElementById("view-placeholder").style.display = "flex";
        document.getElementById("view-editor-area").style.display = "none";
        document.querySelectorAll(".doc-item").forEach(i => i.classList.remove("active"));
      }
    }

    // 「+ 新規追加」ボタンを押したときの処理
    function clickNewDocument() {
      selectedDoc = null; // キャッシュクリア
      document.querySelectorAll(".doc-item").forEach(i => i.classList.remove("active"));

      document.getElementById("view-placeholder").style.display = "none";
      document.getElementById("view-editor-area").style.display = "block";

      // フォーム初期化 (新規なのでIDは空)
      document.getElementById("form-doc-id").value = "";
      
      const titleInput = document.getElementById("form-title");
      titleInput.value = "";
      titleInput.placeholder = "新しいドキュメントのタイトル...";
      titleInput.readOnly = false;

      // ボタンのセット
      document.getElementById("btn-edit").style.display = "none";
      document.getElementById("btn-delete").style.display = "none";
      document.getElementById("btn-save").style.display = "inline-block";
      document.getElementById("btn-cancel").style.display = "inline-block";

      // 通常編集モードでエディタを立ち上げる
      document.getElementById("easymde-textarea").value = "";
      buildEditor(false);
    }

    // 「削除」ボタンをクリックしたときの安全な処理
    function submitDeleteForm() {
      if (selectedDoc && confirm(`「${selectedDoc.title}」を削除してもよろしいですか？`)) {
        const delForm = document.getElementById("delete-form");
        delForm.action = `/markdown/delete/${selectedDoc.id}`;
        delForm.submit();
      }
    }
  </script>
</body>
</html>
